<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FloralPro — galería de prueba del motor</title>
<link rel="stylesheet" href="../css/labg-base.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { padding: 16px; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .gcard { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .gcard svg.fdiagram { width: 100%; max-width: 300px; display: block; margin: 0 auto; }
  .gcard h3 { margin: 0 0 4px; font-size: 1rem; }
  .gcard .ftx { font-family: var(--mono); font-size: .8rem; color: var(--text-muted); }
  .gcard .desc { font-size: .8rem; }
</style>
</head>
<body>
<h1>Galería de prueba</h1>
<div class="gal" id="gal"></div>
<script src="../js/i18n.js"></script>
<script src="../js/model.js"></script>
<script src="../js/formula.js"></script>
<script src="../js/diagram.js"></script>
<script src="../js/section.js"></script>
<script src="../js/specimens.js"></script>
<script>
  const gal = document.getElementById('gal');
  const qs = new URLSearchParams(location.search);
  const only = qs.get('only'), mode = qs.get('colors') || 'whorl';
  if (only) { gal.style.gridTemplateColumns = 'repeat(auto-fill, minmax(620px, 1fr))'; document.head.insertAdjacentHTML('beforeend', '<style>.gcard svg.fdiagram{max-width:600px}</style>'); }
  for (const sp of SPECIMENS) for (const fl of sp.flowers) {
    if (only && !only.split(',').includes(sp.id)) continue;
    const m = fl.m;
    const d = document.createElement('div'); d.className = 'gcard';
    d.innerHTML = `<h3><i>${sp.sci}</i> ${fl.label ? '— ' + fl.label.es : ''}</h3>
      <div class="fformula">${Formula.html(m, 'classic')}</div>
      <div class="fformula">${Formula.html(m, 'prenner', { bracts: true, ovules: true })}</div>
      <div class="ftx">${Formula.text(m, 'classic')}<br>${Formula.text(m, 'prenner', { bracts: true, ovules: true })}</div>
      ${qs.get("sec") ? Section.svg(m, { colors: "natural" }) : Diagram.svg(m, { colors: mode })}
      <div class="desc">${FM.describe(m, 'es').map(x => x.html).join(' ')}</div>`;
    gal.appendChild(d);
  }
</script>
</body>
</html>
